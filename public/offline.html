<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0B" />
    <title>Offline — Shivansh</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0B0B0B;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      .container { max-width: 400px; }
      .icon {
        width: 80px; height: 80px;
        margin: 0 auto 2rem;
        border-radius: 20px;
        background: linear-gradient(135deg, #d4af37, #b8960c);
        display: flex; align-items: center; justify-content: center;
        font-size: 2.5rem; font-weight: 700; color: #0B0B0B;
        letter-spacing: -2px;
      }
      h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; letter-spacing: -0.02em; }
      p { font-size: 0.95rem; color: #999; line-height: 1.6; margin-bottom: 2rem; }
      button {
        background: #d4af37; color: #0B0B0B; border: none;
        padding: 0.875rem 2rem; border-radius: 12px;
        font-size: 0.95rem; font-weight: 600; cursor: pointer;
        transition: opacity 0.2s;
      }
      button:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">SI</div>
      <h1>You're Offline</h1>
      <p>It looks like you've lost your internet connection. Content you've already visited is still available. Please check your connection and try again.</p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
