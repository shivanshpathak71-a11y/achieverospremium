<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="black" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="300" fill="#FFFFFF"/>

  <g transform="translate(150,150)">
    <circle cx="0" cy="0" r="108" fill="none" stroke="url(#black)" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#black)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="90" fill="#F8F8F8"/>

    <g stroke="url(#black)" stroke-width="1.5" fill="none" opacity="0.7">
      <line x1="0" y1="-100" x2="0" y2="-90"/>
      <line x1="0" y1="90" x2="0" y2="100"/>
      <line x1="-100" y1="0" x2="-90" y2="0"/>
      <line x1="90" y1="0" x2="100" y2="0"/>
      <line x1="64" y1="-77" x2="70" y2="-70"/>
      <line x1="-64" y1="-77" x2="-70" y2="-70"/>
      <line x1="64" y1="77" x2="70" y2="70"/>
      <line x1="-64" y1="77" x2="-70" y2="70"/>
    </g>

    <polygon points="0,-82 6,-72 0,-62 -6,-72" fill="url(#black)"/>

    <g filter="url(#shadow)">
      <text x="-38" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" fill="url(#black)" letter-spacing="-2">S</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="14" y="-50" width="34" height="5" rx="1" fill="url(#black)"/>
      <rect x="28" y="-45" width="6" height="80" fill="url(#black)"/>
      <rect x="14" y="35" width="34" height="5" rx="1" fill="url(#black)"/>
      <polygon points="31,0 36,8 31,16 26,8" fill="url(#black)" opacity="0.7"/>
    </g>

    <g fill="url(#black)">
      <rect x="-40" y="55" width="32" height="1.5" rx="0.75"/>
      <polygon points="0,51 2,56 7,56 3,59 5,64 0,61 -5,64 -3,59 -7,56 -2,56" transform="scale(0.8)"/>
      <rect x="8" y="55" width="32" height="1.5" rx="0.75"/>
