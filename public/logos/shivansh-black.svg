    <text x="24" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#0B0B0B" letter-spacing="5">INCOME TAX OFFICER</text>
    <rect x="222" y="0" width="18" height="1.5" rx="0.75" fill="url(#black)" opacity="0.8"/>
  </g>
