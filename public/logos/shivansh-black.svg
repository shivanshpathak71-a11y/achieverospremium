  <rect x="272" y="80" width="1.5" height="140" fill="url(#black)" rx="0.75" opacity="0.7"/>

  <text x="310" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="url(#black)" letter-spacing="10">SHIVANSH</text>

  <rect x="310" y="174" width="462" height="2" rx="1" fill="url(#black)" opacity="0.9"/>

  <g transform="translate(310, 200)">
