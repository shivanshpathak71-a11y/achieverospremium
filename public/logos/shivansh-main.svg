<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E27D"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="60%" stop-color="#B8960C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E27D"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7D0A"/>
    </linearGradient>
    <linearGradient id="silverWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#C0C0C0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#0B0B0B"/>

  <!-- ═══ MONOGRAM ICON — Left section ═══ -->
  <!-- Outer geometric octagon ring -->
  <g transform="translate(150,150)">
    <!-- Outer thin ring -->
    <circle cx="0" cy="0" r="108" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <!-- Inner filled circle -->
    <circle cx="0" cy="0" r="90" fill="#0D0D0D"/>

    <!-- Decorative corner marks at 45° intervals -->
    <g stroke="url(#gold)" stroke-width="1.5" fill="none" opacity="0.7">
      <line x1="0" y1="-100" x2="0" y2="-90"/>
      <line x1="0" y1="90" x2="0" y2="100"/>
      <line x1="-100" y1="0" x2="-90" y2="0"/>
      <line x1="90" y1="0" x2="100" y2="0"/>
      <!-- Diagonal ticks -->
      <line x1="64" y1="-77" x2="70" y2="-70"/>
      <line x1="-64" y1="-77" x2="-70" y2="-70"/>
      <line x1="64" y1="77" x2="70" y2="70"/>
      <line x1="-64" y1="77" x2="-70" y2="70"/>
    </g>

    <!-- Diamond top accent -->
    <polygon points="0,-82 6,-72 0,-62 -6,-72" fill="url(#gold)" filter="url(#glow)"/>

    <!-- ─── Letter S ─── (gold, left-dominant) -->
    <g filter="url(#shadow)">
      <path d="
        M -30 -42
        C -30 -42 -48 -52 -52 -36
        C -56 -18 -36 -12 -20 -8
        C -4 -4 12 4 10 18
        C 8 32 -10 40 -28 34
        C -40 30 -46 22 -46 14
        L -38 14
        C -38 20 -32 28 -22 30
        C -10 34 2 28 4 18
        C 6 8 -10 2 -26 -4
        C -44 -10 -58 -20 -54 -38
        C -50 -56 -30 -62 -14 -56
        C -4 -52 2 -44 2 -36
        L -6 -36
        C -6 -42 -12 -50 -22 -52
        C -32 -54 -42 -48 -44 -38
        C -46 -28 -34 -22 -18 -16
        C -4 -10 12 -2 12 14
        C 12 32 -4 44 -24 40
        C -40 36 -50 26 -52 14
        L -44 14
        C -42 24 -34 32 -22 36
        C -6 40 8 32 10 18
        Z
      " fill="none" stroke="none"/>
      <!-- Clean S letterform -->
      <text x="-38" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" fill="url(#goldV)" letter-spacing="-2">S</text>
    </g>

    <!-- ─── Letter I ─── (white/silver, right pillar) -->
    <g filter="url(#shadow)">
      <!-- Top serif bar -->
      <rect x="14" y="-50" width="34" height="5" rx="1" fill="url(#silverWhite)"/>
      <!-- Vertical stem -->
      <rect x="28" y="-45" width="6" height="80" fill="url(#silverWhite)"/>
      <!-- Bottom serif bar -->
      <rect x="14" y="35" width="34" height="5" rx="1" fill="url(#silverWhite)"/>
      <!-- Small diamond accent on I stem -->
      <polygon points="31,0 36,8 31,16 26,8" fill="url(#gold)" opacity="0.9"/>
    </g>

    <!-- Bottom divider line with star -->
    <g fill="url(#gold)">
      <rect x="-40" y="55" width="32" height="1.5" rx="0.75"/>
      <polygon points="0,51 2,56 7,56 3,59 5,64 0,61 -5,64 -3,59 -7,56 -2,56" transform="scale(0.8)"/>
      <rect x="8" y="55" width="32" height="1.5" rx="0.75"/>
    </g>
  </g>

  <!-- ═══ DIVIDER ═══ -->
  <rect x="272" y="80" width="1.5" height="140" fill="url(#gold)" rx="0.75" opacity="0.7"/>

  <!-- ═══ TEXT BLOCK ═══ -->
  <!-- Main name: SHIVANSH -->
  <text x="310" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="url(#silverWhite)" letter-spacing="10" filter="url(#shadow)">SHIVANSH</text>

  <!-- Gold underline -->
  <rect x="310" y="174" width="462" height="2" rx="1" fill="url(#gold)" opacity="0.9"/>

  <!-- Tagline: INCOME TAX OFFICER -->
  <g transform="translate(310, 200)">
    <rect x="0" y="0" width="18" height="1.5" rx="0.75" fill="url(#gold)" opacity="0.8"/>
    <text x="24" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#D4AF37" letter-spacing="5">INCOME TAX OFFICER</text>
    <rect x="222" y="0" width="18" height="1.5" rx="0.75" fill="url(#gold)" opacity="0.8"/>
  </g>
</svg>
