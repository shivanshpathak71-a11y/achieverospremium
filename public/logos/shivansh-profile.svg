<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E27D"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="60%" stop-color="#B8960C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E27D"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7D0A"/>
    </linearGradient>
    <linearGradient id="silverWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#C0C0C0"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="50%" stop-color="#0B0B0B"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="200" cy="200" r="200" fill="url(#bgGrad)"/>

  <!-- Outer decorative ring -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>
  <circle cx="200" cy="200" r="168" fill="none" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Tick marks -->
  <g transform="translate(200,200)" stroke="url(#gold)" stroke-width="1.5" fill="none" opacity="0.7">
    <line x1="0" y1="-168" x2="0" y2="-155"/>
    <line x1="0" y1="155" x2="0" y2="168"/>
    <line x1="-168" y1="0" x2="-155" y2="0"/>
    <line x1="155" y1="0" x2="168" y2="0"/>
    <line x1="106" y1="-130" x2="116" y2="-116"/>
    <line x1="-106" y1="-130" x2="-116" y2="-116"/>
    <line x1="106" y1="130" x2="116" y2="116"/>
    <line x1="-106" y1="130" x2="-116" y2="116"/>
  </g>

  <!-- Top diamond -->
  <polygon points="200,40 209,54 200,68 191,54" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Letter S -->
  <g transform="translate(200,200)" filter="url(#shadow)">
    <text x="-60" y="35" font-family="Georgia, 'Times New Roman', serif" font-size="140" font-weight="700" fill="url(#goldV)" letter-spacing="-3">S</text>
  </g>

  <!-- Letter I -->
  <g transform="translate(200,200)" filter="url(#shadow)">
    <rect x="22" y="-78" width="52" height="8" rx="2" fill="url(#silverWhite)"/>
    <rect x="44" y="-70" width="8" height="125" fill="url(#silverWhite)"/>
    <rect x="22" y="55" width="52" height="8" rx="2" fill="url(#silverWhite)"/>
    <polygon points="48,0 56,12 48,24 40,12" fill="url(#gold)" opacity="0.9"/>
  </g>

  <!-- Bottom divider with star -->
  <g transform="translate(200,200)" fill="url(#gold)">
    <rect x="-60" y="85" width="50" height="2" rx="1"/>
    <polygon points="0,78 3,86 11,86 5,91 8,99 0,94 -8,99 -5,91 -11,86 -3,86" transform="scale(0.9)"/>
    <rect x="10" y="85" width="50" height="2" rx="1"/>
  </g>
</svg>
